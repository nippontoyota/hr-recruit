name: Sync Fork

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev # We are syncing the dev branch
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add upstream repository
          git remote add upstream https://github.com/nippontoyota/hr-recruit.git
          git fetch upstream
          
          # Merge upstream into current branch
          git merge upstream/dev --allow-unrelated-histories -m "chore: sync with upstream"
          
          # Push to the fork
          git push origin dev
