name: Supabase Recovery Database Restore

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Original successful backup workflow run ID"
        required: true
        default: "43843597091"
        type: string
      confirm_restore:
        description: "Safety gate: MUST be set to true to execute restore. Leave false for Preflight-only mode."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  database-restore:
    name: Restore Recruitment Schema to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Safety confirmation status
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_restore }}" = "true" ]; then
            echo "=================================================================="
            echo "RESTORE EXPLICITLY AUTHORIZED"
            echo "Target database writes will be executed if preflight checks pass."
            echo "=================================================================="
          else
            echo "=================================================================="
            echo "PREFLIGHT-ONLY MODE"
            echo "All compatibility and validation checks will execute."
            echo "NO database writes will be performed against target project."
            echo "=================================================================="
          fi

      - name: Download original backup artifact
        uses: actions/download-artifact@v4
        with:
          name: supabase-backup-${{ inputs.run_id }}
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg

          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/ACCC4CF8.asc
          sudo gpg --no-tty --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg /tmp/ACCC4CF8.asc
          rm -f /tmp/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Decrypt, extract and validate backup archive
        shell: bash
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          mapfile -t encrypted_files < <(
            find downloaded -type f -name "*.enc"
          )

          if [ "${#encrypted_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one encrypted backup file in downloaded artifact."
            exit 1
          fi

          mkdir -p extracted decrypted

          openssl enc -d -aes-256-cbc -pbkdf2 -salt \
            -in "${encrypted_files[0]}" \
            -out decrypted/backup.tar.gz \
            -pass env:BACKUP_ENCRYPTION_KEY

          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import subprocess
          import sys
          import tarfile

          EXPECTED_TABLES = [
              "activity_logs", "alembic_version", "branch_interviews", "candidate_profiles",
              "candidate_screening", "candidates", "communications", "documents",
              "evaluation_tokens", "evaluations", "followups", "interviewer_names",
              "job_openings", "location_templates", "message_templates", "stage_history",
              "technical_questions", "touchpoint_templates", "users"
          ]

          archive = Path("decrypted/backup.tar.gz")
          destination = Path("extracted").resolve()

          # 1. Safe Tar Extraction with Path Bounds Checking
          with tarfile.open(archive, "r:gz") as tar:
              seen = set()
              for member in tar.getmembers():
                  name = PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise RuntimeError(f"Unsupported archive entry: {member.name}")
                  if member.name in seen:
                      raise RuntimeError(f"Duplicate archive entry: {member.name}")
                  seen.add(member.name)

                  target = (destination / Path(*name.parts)).resolve()
                  if target != destination and destination not in target.parents:
                      raise RuntimeError(f"Path escape: {member.name}")

                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = tar.extractfile(member)
                      if source is None:
                          raise RuntimeError(f"Cannot read: {member.name}")
                      with source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)

          dump_path = destination / "database.dump"
          manifest_path = destination / "manifest.json"

          if not dump_path.is_file():
              raise RuntimeError("database.dump is missing from backup")
          if not manifest_path.is_file():
              raise RuntimeError("manifest.json is missing from backup")

          # 2. Parse and Validate Manifest matching exact backup_supabase.py structure and verified baseline
          try:
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = json.load(f)
              if not isinstance(manifest, dict):
                  raise RuntimeError("manifest.json is not a valid JSON dictionary")
              if "bucket" not in manifest or "objects" not in manifest or not isinstance(manifest.get("objects"), list):
                  raise RuntimeError("manifest.json missing required 'bucket' or 'objects' list")
              
              # Validate expected bucket name
              expected_bucket = "candidate-documents"
              if manifest.get("bucket") != expected_bucket:
                  raise RuntimeError(f"Manifest bucket '{manifest.get('bucket')}' does not match expected '{expected_bucket}'")

              # Validate verified file count baseline (1,218 storage objects)
              expected_file_count = 1218
              actual_file_count = len(manifest["objects"])
              if actual_file_count != expected_file_count:
                  raise RuntimeError(f"Manifest objects count ({actual_file_count}) does not match expected baseline ({expected_file_count})")

              print(f"Manifest validated: bucket='{manifest['bucket']}', exactly {actual_file_count} storage files verified.")
          except Exception as ex:
              raise RuntimeError(f"manifest.json validation failed: {ex}")

          # 3. Extract and Verify Recruitment Schema DDL directly via pg_restore -s -n recruitment
          ddl_proc = subprocess.run(
              ["pg_restore", "-s", "-n", "recruitment", "-f", "-", str(dump_path)],
              capture_output=True,
              text=True
          )
          if ddl_proc.returncode != 0:
              raise RuntimeError(f"pg_restore -s failed to extract recruitment DDL: {ddl_proc.stderr.strip()}")

          ddl_sql = ddl_proc.stdout

          # Verify schema definition
          if "CREATE SCHEMA recruitment;" not in ddl_sql:
              raise RuntimeError("DDL missing 'CREATE SCHEMA recruitment;'")

          # Verify all 19 tables in DDL
          found_tables = set(re.findall(r"CREATE TABLE recruitment\.([a-zA-Z0-9_]+)\s*\(", ddl_sql))
          missing_tables = [t for t in EXPECTED_TABLES if t not in found_tables]
          if missing_tables:
              raise RuntimeError(f"DDL missing expected recruitment tables: {missing_tables}")
          print(f"DDL verified: All {len(EXPECTED_TABLES)} expected tables defined in recruitment schema.")

          # 4. Dynamic Inspection of Custom ENUM types, Columns, and Defaults from DDL
          found_enums = sorted(set(re.findall(r"CREATE TYPE recruitment\.([a-zA-Z0-9_]+)\s+AS\s+ENUM", ddl_sql)))
          print(f"DDL verified: {len(found_enums)} custom ENUM types defined in recruitment schema: {', '.join(found_enums)}")

          # Extract column defaults specifically from table definitions
          table_matches = re.findall(r"CREATE TABLE recruitment\.([a-zA-Z0-9_]+)\s*\((.*?)\);", ddl_sql, re.DOTALL)
          defaults_by_col = {}

          for tbl, body in table_matches:
              for line in body.splitlines():
                  line = line.strip().rstrip(",")
                  if not line or line.startswith("--"):
                      continue
                  parts = line.split()
                  if len(parts) >= 2:
                      col_name = parts[0]
                      rest = " ".join(parts[1:])
                      # Extract column DEFAULT expression if present
                      def_m = re.search(r"\bDEFAULT\s+(.+)", rest, re.IGNORECASE)
                      if def_m:
                          d_expr = def_m.group(1).strip()
                          d_expr = re.sub(r"\s+NOT\s+NULL\s*$", "", d_expr, flags=re.IGNORECASE).strip()
                          defaults_by_col[f"{tbl}.{col_name}"] = d_expr

          # Also extract any column defaults set via ALTER TABLE ... SET DEFAULT
          alter_defaults = re.findall(
              r"ALTER TABLE\s+(?:ONLY\s+)?recruitment\.([a-zA-Z0-9_]+)\s+ALTER COLUMN\s+([a-zA-Z0-9_]+)\s+SET DEFAULT\s+([^;\n]+);",
              ddl_sql,
              re.IGNORECASE
          )
          for tbl, col, expr in alter_defaults:
              defaults_by_col[f"{tbl}.{col}"] = expr.strip()

          print(f"DDL verified: {len(defaults_by_col)} column defaults identified across tables.")

          # Extract check constraints (if any)
          check_constraints = re.findall(
              r"ALTER TABLE\s+(?:ONLY\s+)?recruitment\.([a-zA-Z0-9_]+)\s+ADD CONSTRAINT\s+([a-zA-Z0-9_]+)\s+CHECK\s*\((.*?)\);",
              ddl_sql,
              re.IGNORECASE
          )
          print(f"DDL verified: {len(check_constraints)} table check constraints identified.")

          # 5. Extract Function Calls Specifically from Default Expressions and Check Constraints
          known_types_and_keywords = {
              "character", "varying", "varchar", "numeric", "decimal", "text", "regclass",
              "timestamp", "time", "zone", "integer", "boolean", "not", "null", "cast"
          }
          funcs_in_defaults = set()
          for col_key, expr in defaults_by_col.items():
              for m in re.finditer(r"\b([a-zA-Z0-9_]+)\s*\(", expr):
                  fn = m.group(1).lower()
                  if fn not in known_types_and_keywords:
                      funcs_in_defaults.add(fn)

          for tbl, con, expr in check_constraints:
              for m in re.finditer(r"\b([a-zA-Z0-9_]+)\s*\(", expr):
                  fn = m.group(1).lower()
                  if fn not in known_types_and_keywords:
                      funcs_in_defaults.add(fn)

          print(f"DDL verified: Functions extracted from defaults and constraints: {sorted(funcs_in_defaults)}")

          # 6. Candidate ID Column and Sequence DDL Inspection
          cand_col_type = None
          cand_default_expr = defaults_by_col.get("candidates.candidate_id")

          cand_table_match = re.search(r"CREATE TABLE recruitment\.candidates\s*\((.*?)\);", ddl_sql, re.DOTALL)
          if cand_table_match:
              for line in cand_table_match.group(1).splitlines():
                  line = line.strip().rstrip(",")
                  if line.startswith("candidate_id "):
                      m = re.match(r"candidate_id\s+(.+?)(?:\s+DEFAULT\s+(.+))?$", line, re.IGNORECASE)
                      if m:
                          cand_col_type = re.sub(r"\s+NOT\s+NULL\s*$", "", m.group(1), flags=re.IGNORECASE).strip()

          found_sequences = re.findall(r"CREATE SEQUENCE recruitment\.([a-zA-Z0-9_]+)\b", ddl_sql)
          print(f"DDL candidate_id inspection: column type='{cand_col_type}', default='{cand_default_expr}'")
          print(f"DDL sequence inspection: sequences defined={found_sequences}")

          # 7. Extract Baseline Constraints and Explicit Indexes directly from DDL
          ddl_constraints = []
          for match in re.finditer(r"ALTER TABLE ONLY recruitment\.([a-zA-Z0-9_]+)\s+ADD CONSTRAINT ([a-zA-Z0-9_]+)\s+([^;]+);", ddl_sql):
              tbl, con_name, con_def = match.groups()
              ddl_constraints.append({
                  "table_name": tbl,
                  "constraint_name": con_name,
                  "definition": " ".join(con_def.split())
              })

          ddl_indexes = []
          for match in re.finditer(r"(CREATE (?:UNIQUE )?INDEX ([a-zA-Z0-9_]+) ON recruitment\.([a-zA-Z0-9_]+)\s+([^;]+));", ddl_sql):
              full_stmt, idx_name, tbl, idx_def = match.groups()
              ddl_indexes.append({
                  "table_name": tbl,
                  "index_name": idx_name,
                  "definition": " ".join(idx_def.split()),
                  "full_statement": " ".join(full_stmt.split())
              })

          if len(ddl_constraints) != 46:
              raise RuntimeError(f"Expected exactly 46 constraints in DDL baseline, found {len(ddl_constraints)}")
          if len(ddl_indexes) != 33:
              raise RuntimeError(f"Expected exactly 33 explicit indexes in DDL baseline, found {len(ddl_indexes)}")

          print(f"Extracted ground-truth DDL objects: exactly 46 constraints and 33 explicit index statements (56 total index catalog entries expected after restoration).")

          # Verify absence of cross-schema extension function dependencies in recruitment DDL
          external_refs = re.findall(r"\b(extensions|vault|auth|storage)\.[a-zA-Z0-9_]+", ddl_sql, re.IGNORECASE)
          if external_refs:
              raise RuntimeError(f"Unexpected external schema references detected in recruitment DDL: {set(external_refs)}")

          print("DDL verified: Zero external schema references detected in recruitment schema.")

          # Save Ground-Truth Baseline and Dependency Metadata for Preflight and Post-Restore Verification
          ddl_payload = {
              "constraints": ddl_constraints,
              "indexes": ddl_indexes,
              "custom_enums": found_enums,
              "required_functions": sorted(funcs_in_defaults),
              "candidate_id_config": {
                  "column_type": cand_col_type,
                  "default_expression": cand_default_expr,
              },
              "sequences": found_sequences
          }
          with open("/tmp/expected_ddl_objects.json", "w", encoding="utf-8") as f:
              json.dump(ddl_payload, f)
          PY

          rm -rf decrypted

      - name: Target database preflight checks
        shell: bash
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from urllib.parse import urlsplit

          db_url = os.environ.get("RESTORE_DATABASE_URL", "").strip()
          confirm_restore = (os.environ.get("CONFIRM_RESTORE", "false").lower() == "true")
          RUN_ID = os.environ.get("RUN_ID", "43843597091")

          if not db_url:
              print("::error::RESTORE_DATABASE_URL is not set.")
              sys.exit(1)

          EXPECTED_PROJECT_REF = "ozhaqdcgaormjrxyvhun"
          FORBIDDEN_PROJECT_REF = "rupgxwsfkberlaeseigk"

          # 1. Strict Target Project and Hostname Validation
          parsed = urlsplit(db_url)
          host = (parsed.hostname or "").lower()
          user = (parsed.username or "").lower()

          if FORBIDDEN_PROJECT_REF in db_url:
              print("::error::RESTORE_DATABASE_URL contains the legacy/deleted project ref! Aborting immediately.")
              sys.exit(1)

          is_direct_host = host == f"db.{EXPECTED_PROJECT_REF}.supabase.co"
          is_pooler_host = host.endswith(".pooler.supabase.com") and user == f"postgres.{EXPECTED_PROJECT_REF}"

          if not (is_direct_host or is_pooler_host):
              print(f"::error::RESTORE_DATABASE_URL does not match documented recovery project formats for '{EXPECTED_PROJECT_REF}'.")
              print(f"Resolved host: '{host}', user: '{user}'")
              sys.exit(1)

          print(f"Target validated: strictly matches recovery project '{EXPECTED_PROJECT_REF}'.")

          def run_psql(query):
              cmd = [
                  "psql",
                  "-X",
                  "-v",
                  "ON_ERROR_STOP=1",
                  "-At",
                  "-d",
                  db_url,
                  "-c",
                  query,
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  safe_err = res.stderr.replace(db_url, "[REDACTED_URL]").strip()
                  raise RuntimeError(f"psql execution failed: {safe_err}")
              return res.stdout.strip()

          def run_psql_json(query):
              clean_q = query.strip().rstrip(";")
              wrapped = f"SELECT COALESCE(json_agg(sub), '[]'::json) FROM ({clean_q}) sub;"
              raw = run_psql(wrapped)
              return json.loads(raw) if raw else []

          # 2. Strict PostgreSQL 17 Major Version Compatibility Check
          server_version = run_psql("SHOW server_version;")
          server_version_num = int(run_psql("SHOW server_version_num;"))
          target_major = server_version_num // 10000

          print(f"Target server version: {server_version} (num: {server_version_num}, major: {target_major})")
          if target_major != 17:
              print(f"::error::PostgreSQL major version mismatch! Source dump was created using PostgreSQL 17 (17.12). Target must run PostgreSQL 17 (found {server_version}).")
              sys.exit(1)

          # Verify connected user is database administrator (postgres or supabase_admin)
          current_user = run_psql("SELECT current_user;")
          if current_user not in ("postgres", "supabase_admin"):
              print(f"::error::Connected user '{current_user}' is not the expected database administrator role.")
              sys.exit(1)
          print(f"Connected as database administrator: '{current_user}'.")

          target_database = run_psql("SELECT current_database();")
          if target_database != "postgres":
              raise RuntimeError(
                  f"Unexpected target database '{target_database}'. "
                  "Recovery is permitted only on the 'postgres' database."
              )
          print(f"Target database identity verified: '{target_database}'.")

          # 3. Connection Privilege Check
          can_create = run_psql("SELECT has_database_privilege(current_user, current_database(), 'CREATE');")
          if can_create.lower() not in ("t", "true"):
              raise RuntimeError("Connecting user does not have CREATE privilege on target database.")

          # 4. Strict Schema Initial State Check: Reject any pre-existing recruitment schema
          schema_exists = int(run_psql("SELECT count(*) FROM information_schema.schemata WHERE schema_name = 'recruitment';"))
          if schema_exists > 0:
              print("::error::Schema 'recruitment' already exists on target database!")
              print("Refusing to execute restoration to avoid schema creation conflicts or overwriting data.")
              sys.exit(1)
          print("Confirmed: Schema 'recruitment' does NOT exist on target (clean slate).")

          # Check if any application tables exist in public schema
          EXPECTED_TABLES = [
              "activity_logs", "alembic_version", "branch_interviews", "candidate_profiles",
              "candidate_screening", "candidates", "communications", "documents",
              "evaluation_tokens", "evaluations", "followups", "interviewer_names",
              "job_openings", "location_templates", "message_templates", "stage_history",
              "technical_questions", "touchpoint_templates", "users"
          ]
          tables_in_public = run_psql_json(f"""
              SELECT table_name FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name IN ({', '.join(repr(t) for t in EXPECTED_TABLES)});
          """)
          if tables_in_public:
              t_names = [t["table_name"] for t in tables_in_public]
              print(f"::error::Application tables already exist in 'public' schema: {', '.join(t_names)}")
              sys.exit(1)

          # 5. Extension Availability & Catalog Dependency Verification
          with open("/tmp/expected_ddl_objects.json", "r", encoding="utf-8") as f:
              ddl_meta = json.load(f)

          extensions = run_psql_json("SELECT extname, extversion, extnamespace::regnamespace::text AS schema_name FROM pg_extension;")
          ext_names = {e["extname"] for e in extensions}
          print(f"Target extensions installed ({len(ext_names)}): {', '.join(sorted(ext_names))}")

          # Verify functions extracted specifically from defaults and constraints exist on target
          required_functions = ddl_meta.get("required_functions", [])
          target_funcs = []
          if required_functions:
              func_query_params = ", ".join(repr(fn) for fn in required_functions)
              target_funcs = run_psql_json(f"""
                  SELECT
                    p.proname,
                    n.nspname AS schema_name,
                    COALESCE(e.extname, 'core pg_catalog') AS extension_origin
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  LEFT JOIN pg_depend d ON d.objid = p.oid AND d.classid = 'pg_proc'::regclass AND d.refclassid = 'pg_extension'::regclass
                  LEFT JOIN pg_extension e ON e.oid = d.refobjid
                  WHERE p.proname IN ({func_query_params})
                    AND n.nspname = 'pg_catalog';
              """)
              found_func_names = {fn["proname"] for fn in target_funcs}
              missing_funcs = [fn for fn in required_functions if fn not in found_func_names]
              if missing_funcs:
                  raise RuntimeError(f"Target database missing required default functions in pg_catalog: {missing_funcs}")
              print(f"Catalog function dependency verified: Inspected functions ({', '.join(sorted(required_functions))}) exist in 'pg_catalog'.")

          print(
              "Limited dependency checks passed: inspected functions from defaults "
              "and constraints were found in pg_catalog. Custom ENUM types are "
              "defined in recruitment. This is not a complete extension dependency analysis."
          )

          # Execute live evaluation check of native types including uuid, jsonb, and timestamptz
          type_check = run_psql("""
              SELECT
                'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid AS test_uuid,
                '{"test": true}'::jsonb AS test_jsonb,
                now()::timestamptz AS test_timestamptz,
                true::boolean AS test_bool,
                123::integer AS test_int,
                'test'::text AS test_text,
                'test'::varchar AS test_varchar;
          """)
          if not type_check:
              raise RuntimeError("Target database failed live uuid/jsonb/timestamptz type evaluation check.")
          print("Target database live type evaluation verified: uuid, jsonb, and timestamptz successfully evaluated.")

          # Log candidate ID and sequence configuration extracted from DDL
          cand_config = ddl_meta.get("candidate_id_config", {})
          print(f"DDL candidate_id configuration: column type='{cand_config.get('column_type')}', default='{cand_config.get('default_expression')}', sequences={ddl_meta.get('sequences')}")

          # 6. Capture Inventory of Monitored Managed-Schema Objects Before Restoration
          MANAGED_SCHEMAS = [
              'auth', 'storage', 'vault', 'extensions',
              'graphql', 'graphql_public', 'pgbouncer', 'realtime'
          ]
          managed_baseline = run_psql_json(f"""
              SELECT 'relation' AS obj_kind, n.nspname AS schema_name, c.relname AS object_name, c.relkind::text AS sub_kind
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'function' AS obj_kind, n.nspname AS schema_name, p.proname AS object_name, p.prokind::text AS sub_kind
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'type' AS obj_kind, n.nspname AS schema_name, t.typname AS object_name, t.typtype::text AS sub_kind
              FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'trigger' AS obj_kind, n.nspname AS schema_name, tg.tgname AS object_name, '' AS sub_kind
              FROM pg_trigger tg
              JOIN pg_class c ON c.oid = tg.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
                AND NOT tg.tgisinternal
              ORDER BY schema_name, obj_kind, object_name;
          """)
          with open("/tmp/managed_baseline.json", "w", encoding="utf-8") as f:
              json.dump(managed_baseline, f)
          print(f"Captured baseline of monitored managed-schema objects: {len(managed_baseline)} objects across {len(MANAGED_SCHEMAS)} schemas.")

          # If running in Preflight-Only mode (confirm_restore is false), write Preflight Summary
          if not confirm_restore:
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  num_enums = len(ddl_meta.get("custom_enums", []))
                  cand_def = cand_config.get("default_expression") or "None defined"
                  preflight_report = [
                      "# Supabase Recovery Preflight Report (Preflight-Only Mode)\n",
                      f"**Target Project Reference:** `{EXPECTED_PROJECT_REF}` (`nippon-hr-recovery`)  ",
                      f"**Source Backup Run ID:** `{RUN_ID}`  ",
                      "**Execution Mode:** `PREFLIGHT ONLY (Zero database writes performed)`\n",
                      "## Preflight Compatibility & Integrity Assessment",
                      "- ✅ **Target Project Identity:** Verified (`db.ozhaqdcgaormjrxyvhun.supabase.co` or pooler `postgres.ozhaqdcgaormjrxyvhun`)",
                      f"- ✅ **Target Database Name:** Verified ('{target_database}')",
                      "- ✅ **PostgreSQL Version Compatibility:** Target runs PostgreSQL 17 (Matching Source PostgreSQL 17.12)",
                      "- ✅ **Target Initial State:** Clean (Schema `recruitment` does not exist; no application tables in `public`)",
