      - name: Restore recruitment schema into target Supabase project
        if: ${{ inputs.confirm_restore }}
        shell: bash
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "Starting targeted restoration of 'recruitment' schema..."
          echo "Restoration parameters:"
          echo "  - Schema filter: recruitment only (--schema=recruitment)"
          echo "  - Transaction mode: single transaction (atomic, rollback on error)"
          echo "  - Ownership: suppressed (--no-owner, assigned to connected postgres role)"
          echo "  - Privileges: suppressed (--no-privileges, unexposed to public/anon)"
          echo "  - Managed schemas: NOT touched"

          pg_restore \
            --verbose \
            --exit-on-error \
            --single-transaction \
            --no-owner \
            --no-privileges \
            --schema=recruitment \
            --dbname="$RESTORE_DATABASE_URL" \
            extracted/database.dump

          echo "pg_restore completed successfully within atomic transaction."

      - name: Perform comprehensive post-restore verification
        if: ${{ inputs.confirm_restore }}
        shell: bash
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          db_url = os.environ.get("RESTORE_DATABASE_URL", "").strip()
          RUN_ID = os.environ.get("RUN_ID", "43843597091")
          EXPECTED_PROJECT_REF = "ozhaqdcgaormjrxyvhun"

          BASELINE_COUNTS = {
              "activity_logs": 4558,
              "alembic_version": 1,
              "branch_interviews": 0,
              "candidate_profiles": 721,
              "candidate_screening": 0,
              "candidates": 754,
              "communications": 562,
              "documents": 426,
              "evaluation_tokens": 82,
              "evaluations": 947,
              "followups": 0,
              "interviewer_names": 82,
              "job_openings": 4,
              "location_templates": 17,
              "message_templates": 0,
              "stage_history": 233,
              "technical_questions": 273,
              "touchpoint_templates": 10,
              "users": 25,
          }
          EXPECTED_ROW_SUM = 8695
          EXPECTED_CONSTRAINT_COUNT = 46
          EXPECTED_EXPLICIT_INDEX_COUNT = 33
          EXPECTED_CONSTRAINT_INDEX_COUNT = 23
          EXPECTED_TOTAL_INDEX_COUNT = 56

          EXPECTED_SEQ_LAST_VALUE = 825
          EXPECTED_SEQ_IS_CALLED = True

          def run_psql(query):
              cmd = [
                  "psql",
                  "-X",
                  "-v",
                  "ON_ERROR_STOP=1",
                  "-At",
                  "-d",
                  db_url,
                  "-c",
                  query,
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  safe_err = res.stderr.replace(db_url, "[REDACTED_URL]").strip()
                  raise RuntimeError(f"psql execution failed: {safe_err}")
              return res.stdout.strip()

          def run_psql_json(query):
              clean_q = query.strip().rstrip(";")
              wrapped = f"SELECT COALESCE(json_agg(sub), '[]'::json) FROM ({clean_q}) sub;"
              raw = run_psql(wrapped)
              return json.loads(raw) if raw else []

          def md_table(headers, rows):
              if not rows:
                  return "_None found._\n"
              lines = [
                  "| " + " | ".join(headers) + " |",
                  "| " + " | ".join(["---"] * len(headers)) + " |",
              ]
              for r in rows:
                  lines.append("| " + " | ".join(str(c).replace("\n", " ").replace("|", "\\|") for c in r) + " |")
              return "\n".join(lines) + "\n"

          def normalize_sql(s):
              return re.sub(r"\s+", " ", s.strip().lower()).replace('"', "").rstrip(";")

          # Load DDL Ground-Truth Baseline extracted from backup
          with open("/tmp/expected_ddl_objects.json", "r", encoding="utf-8") as f:
              ddl_expected = json.load(f)

          expected_con_map = {c["constraint_name"]: c["definition"] for c in ddl_expected["constraints"]}
          expected_idx_map = {i["index_name"]: i for i in ddl_expected["indexes"]}

          # 1. Verify Restored Tables (Strict: exactly 19, zero missing, zero unexpected)
          discovered_tables_data = run_psql_json("""
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'recruitment' AND table_type = 'BASE TABLE'
              ORDER BY table_name;
          """)
          discovered_tables = [t["table_name"] for t in discovered_tables_data]

          actual_counts = {}
          for t in discovered_tables:
              cnt = run_psql(f'SELECT count(*) FROM recruitment."{t}";')
              actual_counts[t] = int(cnt)

          missing_tables = [t for t in BASELINE_COUNTS if t not in discovered_tables]
          unexpected_tables = [t for t in discovered_tables if t not in BASELINE_COUNTS]
          count_mismatches = []
          for t, expected in BASELINE_COUNTS.items():
              actual = actual_counts.get(t)
              if actual is not None and actual != expected:
                  count_mismatches.append({"table": t, "expected": expected, "actual": actual})

          total_actual_rows = sum(actual_counts.values())

          # 2. Verify Constraints (Strict: exactly 46 constraints, names and normalized definitions)
          constraints = run_psql_json("""
              SELECT
                c.relname AS table_name,
                con.conname AS constraint_name,
                con.contype AS constraint_type,
                pg_get_constraintdef(con.oid, true) AS definition
              FROM pg_constraint con
              JOIN pg_class c ON c.oid = con.conrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'recruitment'
              ORDER BY c.relname, con.conname;
          """)
          actual_con_map = {c["constraint_name"]: c["definition"] for c in constraints}

          missing_ddl_con_names = [c for c in expected_con_map if c not in actual_con_map]
          con_def_mismatches = []
          for con_name, exp_def in expected_con_map.items():
              if con_name in actual_con_map:
                  norm_exp = normalize_sql(exp_def)
                  norm_act = normalize_sql(actual_con_map[con_name])
                  if norm_exp != norm_act:
                      con_def_mismatches.append({"name": con_name, "expected": exp_def, "actual": actual_con_map[con_name]})

          constraint_counts_match = (len(constraints) == EXPECTED_CONSTRAINT_COUNT)
          constraint_names_match = (len(missing_ddl_con_names) == 0)
          constraint_defs_match = (len(con_def_mismatches) == 0)

          # 3. Verify Indexes (Strict: 56 total index catalog entries; 33 explicit DDL indexes + 23 constraint-backed indexes)
          indexes = run_psql_json("""
              SELECT
                c.relname AS table_name,
                i.relname AS index_name,
                idx.indisunique AS is_unique,
                idx.indisprimary AS is_primary,
                pg_get_indexdef(idx.indexrelid) AS definition,
                EXISTS (
                    SELECT 1
                    FROM pg_constraint con
                    WHERE con.conindid = idx.indexrelid
                      AND con.contype IN ('p', 'u')
                ) AS is_constraint_backed
              FROM pg_index idx
              JOIN pg_class c ON c.oid = idx.indrelid
              JOIN pg_class i ON i.oid = idx.indexrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'recruitment'
              ORDER BY c.relname, i.relname;
          """)
          actual_idx_map = {i["index_name"]: i for i in indexes}

          total_index_count_match = (len(indexes) == EXPECTED_TOTAL_INDEX_COUNT)

          # Check the 33 explicit DDL indexes
          missing_explicit_idx_names = [name for name in expected_idx_map if name not in actual_idx_map]
          explicit_idx_def_mismatches = []
          for idx_name, exp_meta in expected_idx_map.items():
              if idx_name in actual_idx_map:
                  act_meta = actual_idx_map[idx_name]
                  norm_exp_stmt = normalize_sql(exp_meta["full_statement"])
                  norm_act_stmt = normalize_sql(act_meta["definition"])
                  if norm_exp_stmt != norm_act_stmt:
                      explicit_idx_def_mismatches.append({
                          "name": idx_name,
                          "expected": exp_meta["full_statement"],
                          "actual": act_meta["definition"]
                      })

          explicit_indexes_match = (len(missing_explicit_idx_names) == 0 and len(explicit_idx_def_mismatches) == 0)

          # Check the 23 constraint-backed indexes
          constraint_backed_indexes = [i for i in indexes if i["is_constraint_backed"]]
          constraint_backed_count_match = (
              len(constraint_backed_indexes) == EXPECTED_CONSTRAINT_INDEX_COUNT
          )
          non_unique_constraint_indexes = [
              i["index_name"]
              for i in constraint_backed_indexes
              if not i["is_unique"]
          ]

          # 4. Read-Only Candidate ID and Sequence State Inspection
          expected_cand_default = ddl_expected.get("candidate_id_config", {}).get("default_expression")
          cand_default = run_psql("""
              SELECT COALESCE(pg_get_expr(d.adbin, d.adrelid), '')
              FROM pg_attrdef d
              JOIN pg_class c ON c.oid = d.adrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              JOIN pg_attribute a ON a.attrelid = d.adrelid AND a.attnum = d.adnum
              WHERE n.nspname = 'recruitment' AND c.relname = 'candidates' AND a.attname = 'candidate_id';
          """)

          if expected_cand_default:
              cand_default_match = (normalize_sql(cand_default) == normalize_sql(expected_cand_default))
          else:
              cand_default_match = True

          # Read-only sequence state verification (No nextval() and no setval() calls)
          seq_state_str = run_psql("SELECT last_value, is_called FROM recruitment.candidate_id_seq;")
          last_val_str, is_called_str = [x.strip() for x in seq_state_str.split("|")]
          actual_seq_last_val = int(last_val_str)
          actual_seq_is_called = is_called_str.lower() in ("t", "true")

          seq_preserved = (
              actual_seq_last_val == EXPECTED_SEQ_LAST_VALUE and
              actual_seq_is_called == EXPECTED_SEQ_IS_CALLED
          )

          # 5. Monitored Managed-Schema Objects Isolation Verification
          MANAGED_SCHEMAS = [
              'auth', 'storage', 'vault', 'extensions',
              'graphql', 'graphql_public', 'pgbouncer', 'realtime'
          ]
          managed_current = run_psql_json(f"""
              SELECT 'relation' AS obj_kind, n.nspname AS schema_name, c.relname AS object_name, c.relkind::text AS sub_kind
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'function' AS obj_kind, n.nspname AS schema_name, p.proname AS object_name, p.prokind::text AS sub_kind
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'type' AS obj_kind, n.nspname AS schema_name, t.typname AS object_name, t.typtype::text AS sub_kind
              FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
              UNION ALL
              SELECT 'trigger' AS obj_kind, n.nspname AS schema_name, tg.tgname AS object_name, '' AS sub_kind
              FROM pg_trigger tg
              JOIN pg_class c ON c.oid = tg.tgrelid
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname IN ({', '.join(repr(s) for s in MANAGED_SCHEMAS)})
                AND NOT tg.tgisinternal
              ORDER BY schema_name, obj_kind, object_name;
          """)

          with open("/tmp/managed_baseline.json", "r", encoding="utf-8") as f:
              managed_baseline = json.load(f)

          baseline_set = {(item["obj_kind"], item["schema_name"], item["object_name"], item["sub_kind"]) for item in managed_baseline}
          current_set = {(item["obj_kind"], item["schema_name"], item["object_name"], item["sub_kind"]) for item in managed_current}

          added_managed_objects = current_set - baseline_set
          removed_managed_objects = baseline_set - current_set
          managed_schemas_untouched = (len(added_managed_objects) == 0 and len(removed_managed_objects) == 0)

          # Build GitHub Actions Step Summary Report
          report = []
          report.append("# Supabase Recovery Database Restoration Report\n")
          report.append(f"**Target Project Reference:** `{EXPECTED_PROJECT_REF}` (`nippon-hr-recovery`)  ")
          report.append(f"**Source Backup Run ID:** `{RUN_ID}`  ")
          report.append("**Target Schema Restored:** `recruitment` (Strict Schema Isolation)\n")

          overall_success = (
              len(discovered_tables) == 19 and
              len(missing_tables) == 0 and
              len(unexpected_tables) == 0 and
              len(count_mismatches) == 0 and
              total_actual_rows == EXPECTED_ROW_SUM and
              constraint_counts_match and
              constraint_names_match and
              constraint_defs_match and
              total_index_count_match and
              explicit_indexes_match and
              constraint_backed_count_match and
              len(non_unique_constraint_indexes) == 0 and
              cand_default_match and
              seq_preserved and
              managed_schemas_untouched
          )

          report.append("## Executive Summary\n")
          if overall_success:
              report.append("### ✅ SUCCESS: All Configured Post-Restore Verification Checks Passed\n")
          else:
              report.append("### ❌ POST-RESTORE VERIFICATION FAILED\n")
              report.append("> [!WARNING]\n> The `recruitment` schema was restored into the target database, but one or more post-restore verification checks failed. **DO NOT re-run this workflow blindly.** Inspect the target database manually before taking any further action.\n")

          report.append(f"- **Tables Restored:** `{len(discovered_tables)} of 19` (Unexpected: `{len(unexpected_tables)}`, Missing: `{len(missing_tables)}`)")
          report.append(f"- **Total Rows Restored:** `{total_actual_rows:,} of {EXPECTED_ROW_SUM:,}` expected rows")
          report.append(f"- **Row Count Discrepancies:** `{len(count_mismatches)}`")
          report.append(f"- **Constraints Cataloged:** `{len(constraints)} of {EXPECTED_CONSTRAINT_COUNT}` expected ({len(constraints)-len(missing_ddl_con_names)}/{EXPECTED_CONSTRAINT_COUNT} names match, {EXPECTED_CONSTRAINT_COUNT-len(con_def_mismatches)}/{EXPECTED_CONSTRAINT_COUNT} strict definition matches)")
          report.append(f"- **Indexes Cataloged:** `{len(indexes)} of {EXPECTED_TOTAL_INDEX_COUNT}` total entries (33 explicit DDL indexes: {33-len(missing_explicit_idx_names)}/33 names match, {33-len(explicit_idx_def_mismatches)}/33 definition matches; 23 constraint-backed indexes: {len(constraint_backed_indexes)}/23 verified)")
          report.append(f"- **Candidate ID Default Binding:** `{'✅ VERIFIED MATCH' if cand_default_match else '❌ MISMATCH'}` (restored: `{cand_default}`)")
          report.append(f"- **Sequence State (`candidate_id_seq`):** `last_value={actual_seq_last_val}, is_called={actual_seq_is_called}` ({'✅ PRESERVED' if seq_preserved else '❌ ALTERED'})")
          report.append(f"- **Monitored Managed-Schema Objects:** `{'No changes detected in monitored managed-schema objects (relations, functions, types, non-internal triggers).' if managed_schemas_untouched else '❌ MODIFICATIONS DETECTED'}`\n")

          report.append("## Table-by-Table Row Count Audit\n")
          table_rows = []
          for tbl in sorted(BASELINE_COUNTS.keys()):
              exp = BASELINE_COUNTS[tbl]
              act = actual_counts.get(tbl, "MISSING")
              status = "✅ MATCH" if act == exp else "❌ MISMATCH"
              table_rows.append([tbl, f"{exp:,}", f"{act:,}" if isinstance(act, int) else act, status])
          report.append(md_table(["Table Name", "Expected Rows", "Actual Restored Rows", "Verification Status"], table_rows))

          if unexpected_tables:
              report.append(f"### ⚠️ Unexpected Tables Discovered ({len(unexpected_tables)})\n")
              for t in unexpected_tables:
                  report.append(f"- `recruitment.{t}` (Rows: {actual_counts.get(t, 0):,})")
              report.append("")

          report.append("## Constraints and Indexes Verification\n")
          report.append(md_table(
              ["Object Category", "Expected Count", "Restored Count", "Name Matching", "Definition Verification", "Status"],
              [
                  ["Constraints (PK, UQ, FK)", str(EXPECTED_CONSTRAINT_COUNT), str(len(constraints)), f"{EXPECTED_CONSTRAINT_COUNT-len(missing_ddl_con_names)}/{EXPECTED_CONSTRAINT_COUNT} Match", f"{EXPECTED_CONSTRAINT_COUNT-len(con_def_mismatches)}/{EXPECTED_CONSTRAINT_COUNT} Strict Match against DDL", "✅ MATCH" if constraint_counts_match and constraint_names_match and constraint_defs_match else "❌ MISMATCH"],
                  ["Explicit Indexes (DDL Defined)", str(EXPECTED_EXPLICIT_INDEX_COUNT), str(len(expected_idx_map) - len(missing_explicit_idx_names)), f"{EXPECTED_EXPLICIT_INDEX_COUNT-len(missing_explicit_idx_names)}/{EXPECTED_EXPLICIT_INDEX_COUNT} Match", f"{EXPECTED_EXPLICIT_INDEX_COUNT-len(explicit_idx_def_mismatches)}/{EXPECTED_EXPLICIT_INDEX_COUNT} Match against DDL Statement", "✅ MATCH" if explicit_indexes_match else "❌ MISMATCH"],
                  ["Constraint-Backed Indexes (PK/UQ)", str(EXPECTED_CONSTRAINT_INDEX_COUNT), str(len(constraint_backed_indexes)), f"{len(constraint_backed_indexes)}/{EXPECTED_CONSTRAINT_INDEX_COUNT} Match", "Unique / PK Catalog Indexes Verified", "✅ MATCH" if constraint_backed_count_match and len(non_unique_constraint_indexes) == 0 else "❌ MISMATCH"],
                  ["Total Catalog Index Entries", str(EXPECTED_TOTAL_INDEX_COUNT), str(len(indexes)), f"{len(indexes)}/{EXPECTED_TOTAL_INDEX_COUNT} Present", "Complete pg_index Catalog Verification", "✅ MATCH" if total_index_count_match and explicit_indexes_match and constraint_backed_count_match else "❌ MISMATCH"],
              ]
          ))

          report.append("## Sequence State Preservation\n")
          report.append(md_table(
              ["Sequence Name", "Expected State", "Actual Restored State", "Default Expression", "Status"],
              [["recruitment.candidate_id_seq", f"last_value={EXPECTED_SEQ_LAST_VALUE}, is_called={EXPECTED_SEQ_IS_CALLED}", f"last_value={actual_seq_last_val}, is_called={actual_seq_is_called}", f"Matched DDL ({cand_default})" if cand_default_match else "MISMATCH", "✅ PRESERVED IN ORIGINAL STATE" if seq_preserved and cand_default_match else "❌ MISMATCH"]]
          ))

          report.append("## Monitored Managed-Schema Objects Isolation Audit\n")
          if managed_schemas_untouched:
              report.append(f"✅ No changes detected in the monitored managed-schema objects across all {len(MANAGED_SCHEMAS)} schemas (`{', '.join(MANAGED_SCHEMAS)}`) for relations, functions, types, and non-internal triggers. Exactly 0 monitored objects added and 0 monitored objects removed during restoration.\n")
          else:
              report.append("❌ Discrepancies detected in monitored managed schemas:\n")
              if added_managed_objects:
                  report.append(f"- Added objects: {added_managed_objects}")
              if removed_managed_objects:
                  report.append(f"- Removed objects: {removed_managed_objects}")
              report.append("")

          report.append("## Permissions and Security Notice\n")
          report.append("> [!NOTE]\n> The `recruitment` schema was restored with `--no-owner` and `--no-privileges` under administrator role `postgres`. Application grants, service role bindings, and RLS policies must be configured and tested separately as part of post-recovery application enablement.\n")

          markdown_content = "\n".join(report)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(markdown_content + "\n")
              print("Report appended to GITHUB_STEP_SUMMARY.")
          else:
              print(markdown_content)

          # Enforcement of verification criteria
          if not overall_success:
              print("::error::RESTORATION COMMITTED BUT VERIFICATION FAILED. The 'recruitment' schema was restored into the target database, but post-restore checks failed. DO NOT re-run this workflow blindly. Inspect the database manually.")
              if len(discovered_tables) != 19 or missing_tables or unexpected_tables:
                  print(f"Table validation failed: {len(discovered_tables)} tables (expected 19). Missing: {missing_tables}, Unexpected: {unexpected_tables}")
              if count_mismatches or total_actual_rows != EXPECTED_ROW_SUM:
                  print(f"Row count validation failed: total {total_actual_rows} (expected {EXPECTED_ROW_SUM}). Mismatches: {count_mismatches}")
              if not constraint_counts_match or missing_ddl_con_names or con_def_mismatches:
                  print(f"Constraint validation failed: found {len(constraints)} (expected {EXPECTED_CONSTRAINT_COUNT}). Missing: {missing_ddl_con_names}, Def mismatches: {con_def_mismatches}")
              if not total_index_count_match or missing_explicit_idx_names or explicit_idx_def_mismatches or not constraint_backed_count_match or non_unique_constraint_indexes:
                  print(f"Index validation failed: found {len(indexes)} (expected {EXPECTED_TOTAL_INDEX_COUNT}). Missing explicit: {missing_explicit_idx_names}, Def mismatches: {explicit_idx_def_mismatches}, Constraint-backed count: {len(constraint_backed_indexes)} (expected {EXPECTED_CONSTRAINT_INDEX_COUNT}), Non-unique constraint indexes: {non_unique_constraint_indexes}")
              if not cand_default_match:
                  print(f"Candidate ID default mismatch: restored '{cand_default}', expected '{expected_cand_default}'")
              if not seq_preserved:
                  print(f"Sequence state mismatch: found ({actual_seq_last_val}, {actual_seq_is_called}), expected ({EXPECTED_SEQ_LAST_VALUE}, {EXPECTED_SEQ_IS_CALLED})")
              if not managed_schemas_untouched:
                  print("Monitored managed-schema objects were modified during restoration!")
              sys.exit(1)

          print("\n=== All Configured Post-Restore Verification Checks Passed ===")
          PY

      - name: Clean up temporary backup files
        if: always()
        shell: bash
        run: |
          rm -rf downloaded decrypted extracted
