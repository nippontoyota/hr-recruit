                          if not r_cache and f_meta.get("cacheControl"):
                              r_cache = f_meta.get("cacheControl")
                              r_cache_source = "stored"

                  if not r_mime or not r_cache:
                      quoted = urllib.parse.quote(p, safe="/")
                      head_url = f"{SUPABASE_URL.rstrip('/')}/storage/v1/object/{EXPECTED_BUCKET}/{quoted}"
