              print(f"  - 100% exact MIME type match ({EXPECTED_FILE_COUNT:,}/{EXPECTED_FILE_COUNT:,})")
              print(f"  - 100% exact cacheControl match ({EXPECTED_FILE_COUNT:,}/{EXPECTED_FILE_COUNT:,})")
              print(f"  - 100% SHA-256 byte-for-byte content equality verified")

