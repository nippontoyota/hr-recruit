                  exp_mime = intended_mime_by_path[p]
                  exp_cache = intended_cache_by_path[p]

                  # Strict exact comparison with standard HTTP header normalization
                  if r_mime:
                      r_mime_norm = r_mime.strip().lower().split(";")[0]
                      exp_mime_norm = exp_mime.strip().lower().split(";")[0]
                      if r_mime_norm != exp_mime_norm:
                          remote_mime_mismatches.append(f"'{p}': remote='{r_mime}', expected='{exp_mime}'")

                  if r_cache:
                      if r_cache_source == "stored":
                          # Rule A: Stored metadata requires exact normalized equality
                          ok, err = verify_stored_cache_control(r_cache, exp_cache)
                          if not ok:
                              remote_cache_mismatches.append(
                                  f"'{p}': stored remote='{r_cache}', expected='{exp_cache}' ({err})"
                              )
                      elif r_cache_source == "http_header":
                          # Rule B: HTTP transport headers verified with verify_http_cache_control()
                          ok, err = verify_http_cache_control(r_cache, exp_cache, is_private_bucket=True)
                          if not ok:
                              remote_cache_mismatches.append(
                                  f"'{p}': HTTP header='{r_cache}', expected='{exp_cache}' ({err})"
                              )
                      else:
