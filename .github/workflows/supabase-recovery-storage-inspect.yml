          elif verified_bucket_id is None:
              if duplicate_bucket_rows:
                  report.append(f"> [!WARNING]\n> **Bucket configuration is AMBIGUOUS (`{len(matching_name_rows)}` duplicate rows matched name `{EXPECTED_BUCKET}`).**\n>")
                  report.append("> Original bucket ID cannot be verified without ambiguity; `storage.objects` rows cannot be matched without guessing.\n>")
              else:
                  report.append("> [!NOTE]\n> **Original bucket ID could not be verified from `storage.buckets`.**\n>")
                  report.append("> `storage.objects` rows cannot be attributed to the target bucket without guessing or assuming the ID equals the bucket name.\n>")
              report.append("> Object metadata was instead verified using `manifest.json` from backup execution.\n")
              report.append(f"- **Manifest Attributes Available:** `path` (relative file key) and `size` (exact byte count).")
              report.append(f"- **Total Storage Objects in Manifest:** `{total_manifest_count:,}`")
              report.append(f"- **Total Stored Data Volume:** `{format_bytes(manifest_total_bytes)}` (`{manifest_total_bytes:,}` bytes)")
              if total_manifest_count > 0:
                  report.append("- **Inferred MIME Type Distribution (from file extensions):**")
                  for mt, cnt in guessed_mimetypes.most_common():
                      pct = f"{cnt / total_manifest_count * 100:.1f}%"
                      report.append(f"  - `{mt}`: {cnt:,} files ({pct})")
              report.append("")
          elif has_objects_data:
              report.append(f"> [!WARNING]\n> **`TABLE DATA` for `storage.objects` was present in `database.dump`, but 0 rows matched verified bucket ID `{verified_bucket_id}`** (total rows in table: `{len(objects_rows):,}`).\n>")
              report.append("> Object metadata was instead verified using `manifest.json` from backup execution.\n")
              report.append(f"- **Manifest Attributes Available:** `path` (relative file key) and `size` (exact byte count).")
              report.append(f"- **Total Storage Objects in Manifest:** `{total_manifest_count:,}`")
              report.append(f"- **Total Stored Data Volume:** `{format_bytes(manifest_total_bytes)}` (`{manifest_total_bytes:,}` bytes)")
              if total_manifest_count > 0:
                  report.append("- **Inferred MIME Type Distribution (from file extensions):**")
                  for mt, cnt in guessed_mimetypes.most_common():
                      pct = f"{cnt / total_manifest_count * 100:.1f}%"
                      report.append(f"  - `{mt}`: {cnt:,} files ({pct})")
              report.append("")
          else:
              report.append("> [!NOTE]\n> **`TABLE DATA` for `storage.objects` was not included in `database.dump`.** Object metadata was instead recorded in `manifest.json` during backup execution.\n")
              report.append(f"- **Manifest Attributes Available:** `path` (relative file key) and `size` (exact byte count).")
              report.append(f"- **Total Storage Objects in Manifest:** `{total_manifest_count:,}`")
              report.append(f"- **Total Stored Data Volume:** `{format_bytes(manifest_total_bytes)}` (`{manifest_total_bytes:,}` bytes)")
              if total_manifest_count > 0:
                  report.append("- **Inferred MIME Type Distribution (from file extensions):**")
                  for mt, cnt in guessed_mimetypes.most_common():
                      pct = f"{cnt / total_manifest_count * 100:.1f}%"
                      report.append(f"  - `{mt}`: {cnt:,} files ({pct})")
              report.append("")

          report.append("### Object Path Comparison (`storage.objects.name` vs `manifest.json`)\n")
          if path_comparison_status == "PASS":
              report.append(f"✅ **100% Exact Path Match:** All `{len(dump_object_paths):,}` object paths from `storage.objects` match `manifest.json` exactly.\n")
              report.append("| Comparison Metric | Baseline (`manifest.json`) | Database Dump (`storage.objects`) | Match Finding |")
              report.append("|---|---|---|---|")
              report.append(f"| **Matching Object Paths** | `{len(raw_manifest_paths):,}` paths | `{len(dump_object_paths):,}` paths | `✅ PASS` (All paths matched) |")
              report.append(f"| **Missing in Database Dump** | `0` expected | `{len(paths_missing_in_dump):,}` missing | `✅ PASS` |")
              report.append(f"| **Unexpected in Database Dump** | `0` expected | `{len(paths_unexpected_in_dump):,}` unexpected | `✅ PASS` |")
              report.append(f"| **Duplicate Paths in Dump** | `0` expected | `{len(dump_duplicate_paths):,}` duplicates | `✅ PASS` |")
              report.append(f"| **Duplicate Paths in Manifest** | `0` expected | `{len(manifest_duplicate_paths):,}` duplicates | `✅ PASS` |")
              report.append(f"| **Total Count Difference** | `{len(raw_manifest_paths):,}` | `{len(dump_object_paths):,}` | `✅ PASS` (Difference: `0`) |\n")
          elif path_comparison_status == "FAIL":
              report.append(f"> [!WARNING]\n> **Object path mismatch detected between `storage.objects` and `manifest.json`!**\n>\n> {path_comparison_detail}\n")
              report.append("| Comparison Metric | Baseline (`manifest.json`) | Database Dump (`storage.objects`) | Match Finding |")
              report.append("|---|---|---|---|")
              report.append(f"| **Matching Object Paths** | `{len(raw_manifest_paths):,}` paths | `{len(dump_object_paths):,}` paths | `{len(dump_paths_set & manifest_paths_set):,}` matched |")
              report.append(f"| **Missing in Database Dump** | `0` expected | `{len(paths_missing_in_dump):,}` missing | `{'✅ PASS' if len(paths_missing_in_dump) == 0 else '❌ FAIL'}` |")
              report.append(f"| **Unexpected in Database Dump** | `0` expected | `{len(paths_unexpected_in_dump):,}` unexpected | `{'✅ PASS' if len(paths_unexpected_in_dump) == 0 else '❌ FAIL'}` |")
              report.append(f"| **Duplicate Paths in Dump** | `0` expected | `{len(dump_duplicate_paths):,}` duplicates | `{'✅ PASS' if len(dump_duplicate_paths) == 0 else '❌ FAIL'}` |")
              report.append(f"| **Duplicate Paths in Manifest** | `0` expected | `{len(manifest_duplicate_paths):,}` duplicates | `{'✅ PASS' if len(manifest_duplicate_paths) == 0 else '❌ FAIL'}` |")
              report.append(f"| **Total Count Difference** | `{len(raw_manifest_paths):,}` | `{len(dump_object_paths):,}` | `{'✅ PASS' if count_difference == 0 else '❌ FAIL'}` (Difference: `{count_difference:+d}`) |\n")
          else:
              report.append(f"> [!NOTE]\n> **Object path comparison is UNAVAILABLE.**\n>\n> {path_comparison_detail}\n")

          report.append("## 3. Storage Manifest & Individual File Verification\n")
          report.append("| Verification Metric | Manifest Baseline | On-Disk Extracted Files | Match Status |")
          report.append("|---|---|---|---|")
          report.append(f"| **Total Files Count** | `{total_manifest_count:,}` files | `{len(all_disk_files):,}` files | `{'✅ PASS' if total_manifest_count == len(all_disk_files) and total_manifest_count == EXPECTED_FILE_COUNT else '❌ FAIL'}` |")
          report.append(f"| **Total Stored Size** | `{format_bytes(manifest_total_bytes)}` | `{format_bytes(disk_total_bytes)}` | `{'✅ PASS' if manifest_total_bytes == disk_total_bytes and manifest_total_bytes == EXPECTED_TOTAL_SIZE else '❌ FAIL'}` |")
          report.append(f"| **Missing Files** | `0` expected | `{len(missing_files):,}` missing | `{'✅ PASS' if len(missing_files) == 0 else '❌ FAIL'}` |")
          report.append(f"| **Size Mismatches** | `0` expected | `{len(size_mismatches):,}` mismatched | `{'✅ PASS' if len(size_mismatches) == 0 else '❌ FAIL'}` |")
          report.append(f"| **Unexpected Files** | `0` expected | `{len(unexpected_files):,}` unexpected | `{'✅ PASS' if len(unexpected_files) == 0 else '❌ FAIL'}` |")
          report.append(f"| **Duplicate Manifest Paths** | `0` expected | `{len(duplicate_manifest_paths):,}` duplicates | `{'✅ PASS' if len(duplicate_manifest_paths) == 0 else '❌ FAIL'}` |")
          report.append(f"| **Malformed Manifest Entries** | `0` expected | `{len(malformed_manifest_entries):,}` malformed | `{'✅ PASS' if len(malformed_manifest_entries) == 0 else '❌ FAIL'}` |\n")

          report.append("### File Extension Distribution (Aggregate / No PII)\n")
          report.append("| Extension | Object Count | Percentage | Primary Document Purpose |")
          report.append("|---|---|---|---|")
          for ext, count in extension_counts.most_common():
              pct = f"{count / total_manifest_count * 100:.1f}%" if total_manifest_count > 0 else "0.0%"
              purpose = "Resumes / Application PDFs" if ext == ".pdf" else ("Images / Scanned Documents" if ext in (".jpg", ".jpeg", ".png") else "Candidate Attachments")
              report.append(f"| `{ext}` | {count:,} | {pct} | {purpose} |")
          report.append("")

          report.append("## 4. Database Dump Catalog Analysis for `storage` Schema\n")
          report.append(f"- **Schema `storage` in TOC:** `{'YES' if has_storage_schema else 'NO'}`")
          report.append(f"- **Table `storage.buckets` DDL in TOC:** `{'YES' if has_buckets_table else 'NO'}`")
          report.append(f"- **Table Data for `storage.buckets` in TOC:** `{'YES (' + str(buckets_toc_data_count) + ' block(s))' if has_buckets_data else 'NO'}`")
          report.append(f"- **Extracted COPY Blocks for `storage.buckets`:** `{buckets_res['blocks_detected']}` detected (terminated: `{buckets_res['blocks_terminated']}`)")
          report.append(f"- **Table `storage.objects` DDL in TOC:** `{'YES' if has_objects_table else 'NO'}`")
          report.append(f"- **Table Data for `storage.objects` in TOC:** `{'YES (' + str(objects_toc_data_count) + ' block(s))' if has_objects_data else 'NO'}`")
          report.append(f"- **Extracted COPY Blocks for `storage.objects`:** `{objects_res['blocks_detected']}` detected (terminated: `{objects_res['blocks_terminated']}`)")
          report.append(f"- **Total `storage` Schema Objects in TOC:** `{len(storage_toc_entries)}`\n")

          summary_content = "\n".join(report)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(summary_content + "\n")
              print("Storage inspection summary successfully written to GITHUB_STEP_SUMMARY.")
          else:
              print(summary_content)

          print(f"\n=== Storage Metadata Inspection Verdict: {overall_verdict} ===")
          if overall_verdict == "FAIL":
              print(f"::error::Storage inspection failed: {verdict_summary}", file=sys.stderr)
              sys.exit(1)
