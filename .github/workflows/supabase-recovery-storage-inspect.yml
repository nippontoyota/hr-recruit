          report.append("**Execution Mode:** `STRICTLY READ-ONLY (No database or Supabase Storage resources were modified)`\n")

          report.append("> [!NOTE]\n> **READ-ONLY INSPECTION**: No database or Supabase Storage resources were modified. All inspection operations ran locally on the runner using `pg_restore`, `manifest.json`, and extracted backup components.\n")

          report.append("## Executive Summary Status Matrix\n")
          report.append("| Inspection Dimension | Status | Verified Finding |")
          report.append("|---|---|---|")
          report.append(f"| **1. Backup Run ID** | `PASS` | `{RUN_ID}` (Validated positive integer) |")
          report.append(f"| **2. Archive Decryption** | `PASS` | Successfully decrypted with AES-256-CBC PBKDF2 |")
