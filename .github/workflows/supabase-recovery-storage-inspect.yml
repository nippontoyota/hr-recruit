          report.append(f"| **6. Original Bucket Identifier (`id` / `name`)** | `{bucket_name_status}` | `id='{bucket_id_val}', name='{bucket_name_val}'` |")
          report.append(f"| **7. Original Bucket Public/Private** | `{public_status}` | `{public_val}` |")
          report.append(f"| **8. Original File Size Limit** | `{file_size_limit_status}` | `{file_size_limit_val}` |")
          report.append(f"| **9. Original Allowed MIME Types** | `{allowed_mime_status}` | `{allowed_mime_types_val}` |")
          report.append(f"| **10. Available Object Metadata Fields** | `{object_metadata_status}` | `{'Found ' + str(len(metadata_fields_discovered)) + ' fields in dump' if metadata_fields_discovered else 'Available in manifest.json: path, size, extension'}` |")
          report.append(f"| **11. Object Paths vs Manifest Comparison** | `{path_comparison_status}` | {path_comparison_detail} |")
          report.append(f"| **12. Storage Files Individual Verification** | `{file_verification_status}` | {file_verify_finding} |")
          report.append(f"| **13. Overall Inspection Verdict** | `{overall_verdict}` | {verdict_summary} |\n")

          report.append("## 1. Original Bucket Configuration (`candidate-documents`)\n")
          if all_bucket_fields_recovered:
              report.append("Complete configuration recovered and verified in both table DDL and COPY data:\n")
              report.append("| Approved Configuration Field | DDL Column | COPY Column | Recovered Value | Audit Finding |")
              report.append("|---|---|---|---|---|")
              report.append(f"| **Bucket ID** | `id` (Found) | `id` (Found) | `{bucket_id_val}` | Target bucket primary key identifier |")
              report.append(f"| **Bucket Name** | `name` (Found) | `name` (Found) | `{bucket_name_val}` | Target bucket name (matches expected) |")
              report.append(f"| **Public / Private Setting** | `public` (Found) | `public` (Found) | `{public_val}` | Target bucket visibility |")
              report.append(f"| **File Size Limit** | `file_size_limit` (Found) | `file_size_limit` (Found) | `{file_size_limit_val}` | Maximum upload size restriction |")
              report.append(f"| **Allowed MIME Types** | `allowed_mime_types` (Found) | `allowed_mime_types` (Found) | `{allowed_mime_types_val}` | Permitted file format whitelist |\n")
          elif target_bucket_row is not None:
              report.append("> [!WARNING]\n> **Original bucket configuration is INCOMPLETE or AMBIGUOUS in `database.dump`.**\n>")
              if duplicate_bucket_rows:
                  report.append(f"> Found `{len(matching_name_rows)}` duplicate rows matching bucket name `{EXPECTED_BUCKET}` in `storage.buckets`. Configuration is ambiguous.\n>")
