              if metadata_parse_errors > 0:
                  report.append(f"- **Metadata Parsing Failures:** `{metadata_parse_errors}` objects could not be parsed as valid JSON.")
              if mimetypes_discovered:
                  report.append("- **MIME Types Cataloged in Database:**")
                  for mt, cnt in mimetypes_discovered.most_common():
