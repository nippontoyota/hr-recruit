          manifest_finding = (
              f"bucket='{manifest_bucket}', {total_manifest_count:,} entries cataloged "
              f"({len(manifest_validation_errors):,} validation errors, "
              f"{len(malformed_manifest_entries):,} malformed, {len(duplicate_manifest_paths):,} duplicates)"
          )

          bucket_finding = (
              "Complete configuration verified in both DDL & COPY data"
              if all_bucket_fields_recovered else bucket_config_status
