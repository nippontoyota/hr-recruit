              if public_status != "PASS":
                  report.append(f"> Visibility status: `{public_status}` (`{public_val}`).\n>")
              if file_size_limit_status != "PASS":
                  report.append(f"> Size limit status: `{file_size_limit_status}` (`{file_size_limit_val}`).\n>")
              if allowed_mime_status != "PASS":
                  report.append(f"> Allowed MIME status: `{allowed_mime_status}` (`{allowed_mime_types_val}`).\n>")
              report.append("\n| Approved Configuration Field | DDL Status | COPY Status | Recovered Value / Detail |")
              report.append("|---|---|---|---|")
              report.append(f"| **Bucket ID** | `{'Found' if 'id' in buckets_ddl_set else 'MISSING'}` | `{'Found' if 'id' in buckets_copy_set else 'MISSING'}` | `{bucket_id_val}` |")
              report.append(f"| **Bucket Name** | `{'Found' if 'name' in buckets_ddl_set else 'MISSING'}` | `{'Found' if 'name' in buckets_copy_set else 'MISSING'}` | `{bucket_name_val}` |")
              report.append(f"| **Public / Private Setting** | `{'Found' if 'public' in buckets_ddl_set else 'MISSING'}` | `{'Found' if 'public' in buckets_copy_set else 'MISSING'}` | `{public_val}` |")
              report.append(f"| **File Size Limit** | `{'Found' if 'file_size_limit' in buckets_ddl_set else 'MISSING'}` | `{'Found' if 'file_size_limit' in buckets_copy_set else 'MISSING'}` | `{file_size_limit_val}` |")
              report.append(f"| **Allowed MIME Types** | `{'Found' if 'allowed_mime_types' in buckets_ddl_set else 'MISSING'}` | `{'Found' if 'allowed_mime_types' in buckets_copy_set else 'MISSING'}` | `{allowed_mime_types_val}` |\n")
          else:
              report.append("> [!WARNING]\n> **Original bucket configuration is UNAVAILABLE in `database.dump`.**\n>")
              if has_buckets_data:
                  report.append(f"> `TABLE DATA` for `storage.buckets` was present in `database.dump`, but 0 rows matched bucket `{EXPECTED_BUCKET}`.\n>")
              else:
                  report.append("> `TABLE DATA` for `storage.buckets` was not included in the PostgreSQL dump.\n>")
              report.append("> The workflow will not assume or infer default values (such as private access or size limits) for production HR storage.\n")
              report.append("| Approved Configuration Field | Status | Detail |")
              report.append("|---|---|---|")
              report.append(f"| **Bucket Name / ID** | `IDENTIFIED` | `{EXPECTED_BUCKET}` (from `manifest.json` and backup script) |")
              report.append("| **Public / Private Setting** | `UNAVAILABLE` | Row not found in dump; must not be assumed |")
              report.append("| **File Size Limit** | `UNAVAILABLE` | Row not found in dump; must not be assumed |")
              report.append("| **Allowed MIME Types** | `UNAVAILABLE` | Row not found in dump; must not be assumed |\n")

          report.append("## 2. Storage Objects Metadata Audit (`storage.objects`)\n")
          if bucket_objects:
